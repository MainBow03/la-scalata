async function loadPortraits(){
 if(sessionStorage.getItem('scalata_portrait_v2')){
   try{Object.assign(portraitUrls,JSON.parse(sessionStorage.getItem('scalata_portrait_v2')))}catch(e){}
   refreshPortraits();return;
 }
 const batches=[portraitWiki.slice(0,14),portraitWiki.slice(14,28)];
 for(let b=0;b<batches.length;b++){
   await Promise.all(batches[b].map(async (title,i)=>{
     const index=b*14+i;
     try{
       const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title),{mode:'cors'});
       if(!r.ok)return;
       const data=await r.json();
       const url=data.thumbnail?.source;
       if(typeof url==='string' && /^https:\/\/upload\.wikimedia\.org\//.test(url))portraitUrls[index]=url;
     }catch(e){}
   }));
   refreshPortraits();
 }
 try{sessionStorage.setItem('scalata_portrait_v2',JSON.stringify(portraitUrls))}catch(e){}

 let players=room?.players||[{uid:'x1',name:'Gumball',avatar:2,alive:true},{uid:'x2',name:'Finn',avatar:4,alive:true},{uid:'x3',name:'SpongeBob',avatar:0,alive:true},{uid:'x4',name:'Marceline',avatar:6,alive:true}];

 let current=preview?3:clamp(total-players.filter(p=>p.alive).length+1,1,total);
 let champion=room?.phase==='champion';
 let rows='';for(let level=total;level>=1;level--){
   let onStep=players.filter(p=>p.alive&&(champion?level===total:level===current)||!p.alive&&p.eliminatedAt===level);

   const chips=onStep.map(p=>`<span class="mini-contestant ${!p.alive?'ghost':''}">${charAvatar(p)}<span class="clip">${esc(p.name)}</span></span>`).join('');
   rows+=`<div class="step ${level===current?'current':''}" style="--stepindex:${total-level+1}"><span class="step-num">${level<10?'0':''}${level}</span>${chips}</div>`;
 }

function randomBanter(ps){const bots=ps.filter(p=>p.bot);const p=bots.length?bots[(state.room?.turn||0)%bots.length]:ps[0];if(!p)return 'Che vinca il migliore!';const c=character(p.avatar),lines=dialog[c.trait]||dialog.chaos;return `${esc(p.name)}: «${esc(lines[(state.room?.turn||0)%lines.length])}»`;}
function render(){updateConnection();if(state.view==='home'){cleanupMini();state.renderKey='';app.innerHTML=home();return}if(state.view==='setup'){cleanupMini();state.renderKey='';app.innerHTML=setup();return}const r=state.room;if(!r){switchView('home');return}const key=`${r.phase}:${r.turn}:${state.uid}`;if(r.phase==='playing'&&state.renderKey===key)return;cleanupMini();state.renderKey=key;const page={lobby:lobby,playing:gamePage,result:resultPage,elimination:eliminationPage,champion:championPage}[r.phase];app.innerHTML=page?page():lobby();if(r.phase==='playing'&&myPlayer()?.alive&&eligible().includes(state.uid))startMini();
 else if(r.phase==='playing'&&!state.online){

function chooseMini(r,forced){if(forced)return forced;const options=games.filter(g=>g.id!==r.lastMiniId);return options[rand(0,options.length-1)].id;}

function botRandom(p,g,r){
 let seed=2166136261;const key=p.uid+':'+g.id+':'+r.turn;
 for(let i=0;i<key.length;i++){seed^=key.charCodeAt(i);seed=Math.imul(seed,16777619)}
 return ()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296};
}
function rawForBot(p,g,r){
 const random=botRandom(p,g,r),c=character(p.avatar);
 const base={easy:.41,normal:.64,hard:.84}[r.difficulty]||.64;
 const skill=clamp(base+(c.trait===g.kind?.12:0)+(c.trait==='chaos'?(random()-.5)*.28:0),.14,.97);
 const chance=x=>random()<x, score=n=>clamp(Math.round(n),0,100);
 if(g.id==='chests')return [20,35,50,65,85,100][Math.floor(random()*6)];
 if(g.id==='bridge'){let safe=0;for(let i=0;i<7;i++)if(chance(.49+skill*.43))safe++;return score(safe/7*100)}
 if(g.id==='laser'){let dodge=0;for(let i=0;i<12;i++)if(chance(.38+skill*.59))dodge++;return score(dodge/12*100)}
 if(g.id==='tower'){let points=0;for(let i=0;i<5;i++){const error=Math.abs(random()-.5)*190*(1-skill)+(1-skill)*7;points+=score(100-error*2)}return score(points/5)}
 if(g.id==='rhythm'){let hits=0,errors=0;for(let i=0;i<12;i++){if(chance(.29+skill*.69))hits++;else if(chance(.19))errors++;}return score(hits/12*100-errors*3)}
 if(g.id==='vault'){
   const all=Array.from({length:1000},(_,i)=>String(i).padStart(3,'0'));
   const target=all[Math.floor(random()*all.length)];
   const feedback=(a,b)=>{
     let exact=0,overlap=0;const x={},y={};
     for(let i=0;i<3;i++){if(a[i]===b[i])exact++;x[a[i]]=(x[a[i]]||0)+1;y[b[i]]=(y[b[i]]||0)+1}
     for(const k of Object.keys(y))overlap+=Math.min(x[k]||0,y[k]);return [exact,overlap-exact];
   };
   let options=all,best=0;
   for(let attempt=1;attempt<=6;attempt++){
     const guess=chance(skill)?options[Math.floor(random()*options.length)]:all[Math.floor(random()*all.length)];
     const hint=feedback(target,guess);
     if(hint[0]===3)return score(clamp(115-attempt*13,45,100));
     best=Math.max(best,hint[0]*22+hint[1]*10);
     options=options.filter(code=>{const x=feedback(code,guess);return x[0]===hint[0]&&x[1]===hint[1]});
     if(!options.length)break;
   }
   return score(best);
 }
 if(g.id==='memory'){
   let pairs=0,turns=0;while(pairs<8&&turns<14){turns++;if(chance(.10+skill*.53))pairs++;}
   return score(pairs*12.5-(turns-pairs)*1.1);
 }
 if(g.id==='reaction'){if(chance((1-skill)*.1))return 0;const ms=110+(1-skill)*420+random()*90;return score(110-ms/9)}
 if(g.id==='target'){let hits=0,wrong=0;for(let i=0;i<11;i++){if(chance(.35+skill*.62))hits++;else wrong++;}return score(hits*10-wrong*5)}
 if(g.id==='quiz'){let correct=0,errors=0;for(let i=0;i<6;i++){if(chance(skill*.82+.08))correct++;else errors++;}return score(correct*20-errors*5)}
 if(g.id==='sequence'){let right=0;for(let i=0;i<5;i++)if(chance(.20+skill*.77))right++;return score(right*20)}
 if(g.id==='stars'){const error=Math.floor((1-skill)*10*random()+random()*.8);return score(100-error*22)}
 if(g.id==='colors'){let right=0,wrong=0;for(let i=0;i<8;i++){if(chance(.28+skill*.72))right++;else wrong++;}return score(right*14-wrong*5)}
 return score(30+skill*60+(random()-.5)*20);
}
function botArena(r,g){
 const bots=r.players.filter(p=>p.bot&&p.alive&&(r.mode!=='tiebreak'||r.eligible?.includes(p.uid)));
 if(!bots.length)return '';
 return '<div class="bot-arena"><div class="bot-arena-head"><strong>⚙ NPC IN GARA</strong><span>Simulazione live</span></div>'+
 bots.map(p=>'<div class="bot-runner">'+charAvatar(p,'sm')+'<div class="bot-runner-main"><span>'+esc(p.name)+'</span><div class="bot-runner-track"><i data-bot-meter="'+esc(p.uid)+'" data-final="'+rawForBot(p,g,r)+'" style="width:0%"></i></div></div><b data-bot-value="'+esc(p.uid)+'">0</b></div>').join('')+'</div>';
}

const PRIZES_BY_COUNT={

 12:[14,12,11,10,9,8,7,6,5,4,3,1]
};

function outcomeForRoom(r,submitted){
 const ps=r.mode==='tiebreak'?r.players.filter(p=>p.alive&&r.eligible.includes(p.uid)):r.players.filter(p=>p.alive);

 if(g.id==='quiz'){
 let correct=0,errors=0,answer=0;const question=()=>{const op=rand(0,2);let a,b;if(op===2){a=rand(2,11);b=rand(2,9);answer=a*b}else{a=rand(8,48);b=rand(2,34);if(op===1&&b>a)[a,b]=[b,a];answer=op===0?a+b:a-b}updateStat('#quiz-question',`${a} ${['+','−','×'][op]} ${b} = ?`);$('#quiz-answer').value='';$('#quiz-answer').focus()};
 m.innerHTML=`<p>Rispondi e premi Invio. 5 risposte esatte per un punteggio perfetto.</p><h3 id="quiz-question">Caricamento...</h3><form id="quiz-form" class="quiz-row"><input id="quiz-answer" type="number" class="answer-input" inputmode="numeric" autocomplete="off" required><button class="btn btn-gold" type="submit">CONFERMA</button></form><div class="minigame-stats"><span class="stat-chip" id="quiz-ok">Corrette: 0</span><span class="stat-chip" id="quiz-error">Errori: 0</span></div>`;question();$('#quiz-form').addEventListener('submit',e=>{e.preventDefault();if(s.done)return;let v=Number($('#quiz-answer').value);if(v===answer){correct++;updateStat('#quiz-ok',`Corrette: ${correct}`)}else{errors++;updateStat('#quiz-error',`Errori: ${errors}`)}s.raw=clamp(correct*20-errors*5,0,100);if(correct>=5)finishMini(s.raw,'Calcolo completato!');else question()});return;
 }
 if(g.id==='chests'){
 const prizes=shuffle([20,35,50,65,85,100]);m.innerHTML=`<p>Sei forzieri, un'unica scelta. Cosa troverai?</p><div class="chests">${prizes.map((_,i)=>`<button class="chest" data-chest="${i}" aria-label="Forziere ${i+1}">🧰</button>`).join('')}</div><p>Ogni forziere contiene un valore da 20 a 100.</p>`;m.addEventListener('click',e=>{const b=e.target.closest('[data-chest]');if(!b||s.done)return;const prize=prizes[Number(b.dataset.chest)];finishMini(prize,`Hai trovato ${prize} punti!`)});return;
 }
 if(g.id==='sequence'){
 const symbols=['🌙','🔥','💎','🌈'];const code=Array.from({length:5},()=>symbols[rand(0,3)]);let input=[],ready=false;
 m.innerHTML=`<p>Ricorda l'ordine dei cinque simboli.</p><div class="sequence-icons" id="sequence-display">${code.map(x=>`<span class="sequence-icon">${x}</span>`).join('')}</div><div id="sequence-answers" class="options-grid" style="display:none">${symbols.map((x,i)=>`<button class="option-tile" data-symbol="${i}">${x}</button>`).join('')}</div><div class="stat-chip" id="sequence-counter">Osserva attentamente...</div>`;later(4300,()=>{ready=true;$('#sequence-display').innerHTML='❔ ❔ ❔ ❔ ❔';$('#sequence-answers').style.display='grid';updateStat('#sequence-counter','Sequenza inserita: 0/5')});m.addEventListener('click',e=>{const b=e.target.closest('[data-symbol]');if(!b||!ready||s.done)return;input.push(symbols[Number(b.dataset.symbol)]);updateStat('#sequence-counter',`Sequenza inserita: ${input.length}/5`);s.raw=input.filter((x,i)=>x===code[i]).length*20;if(input.length===5)finishMini(s.raw,`${s.raw/20} simboli nella posizione corretta`)});return;
 }
 if(g.id==='stars'){
 const count=rand(8,20),symbols=Array.from({length:count},()=>['⭐','🌟','✨'][rand(0,2)]);m.innerHTML=`<p>Quante stelle ci sono? Osservale per 5 secondi!</p><div class="stars-view" id="star-view">${symbols.map(x=>`<span>${x}</span>`).join('')}</div><form id="stars-form" class="quiz-row" style="display:none"><input id="stars-answer" class="answer-input" type="number" min="0" max="99" placeholder="Quante?" required><button class="btn btn-gold" type="submit">INDOVINA</button></form>`;later(4900,()=>{$('#star-view').innerHTML='<h3>⭐ ? ⭐</h3>';$('#stars-form').style.display='flex';$('#stars-answer').focus()});$('#stars-form').addEventListener('submit',e=>{e.preventDefault();if(s.done)return;let guess=Number($('#stars-answer').value),raw=clamp(100-Math.abs(guess-count)*22,0,100);finishMini(raw,`Erano ${count} stelle!`)});return;
 }
 if(g.id==='colors'){
 const cols=[['ROSSO','#fd7c8f'],['BLU','#68b2fc'],['VERDE','#70e5a4'],['GIALLO','#ffe080']];let correct=0,wrong=0,answer=0;
 m.innerHTML=`<p>Ignora la parola: clicca il colore con cui è scritta!</p><h3 id="color-word" style="font-size:70px">COLORE</h3><div class="options-grid">${cols.map((c,i)=>`<button class="option-tile" data-color="${i}">${c[0]}</button>`).join('')}</div><div class="stat-chip" id="color-count">Risposte corrette: 0</div>`;const newWord=()=>{let word=rand(0,3);answer=rand(0,3);if(rand(0,3)>0&&word===answer)answer=(word+rand(1,3))%4;const t=$('#color-word');t.textContent=cols[word][0];t.style.color=cols[answer][1]};newWord();m.addEventListener('click',e=>{const b=e.target.closest('[data-color]');if(!b||s.done)return;if(Number(b.dataset.color)===answer)correct++;else wrong++;s.raw=clamp(correct*14-wrong*5,0,100);updateStat('#color-count',`Corrette: ${correct} · Errori: ${wrong}`);if(correct>=7)finishMini(s.raw,'Maestro dei colori!');else newWord()});return;
 }
}

app.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='home'||a==='leave'){cleanupRoom();switchView('home');return}
 if(a.startsWith('open-')){state.setupMode=a.replace('open-','');switchView('setup');return}
 if(a==='character'){const old=$('#player-name')?.value;if(old!==undefined)state.name=old;state.npc=Number($('#npc-count')?.value||state.npc);state.roundsPerElim=Number($('#rounds-count')?.value||state.roundsPerElim);state.difficulty=$('#difficulty')?.value||state.difficulty;state.character=Number(b.dataset.id);render();return}
 if(a==='start-local')return startLocal();
 if(a==='create-room')return createOnline();
 if(a==='join-room')return joinOnline();
 if(a==='retry-score'){const pending=state.pendingSubmission;if(!pending||!state.online)return;try{const {doc,setDoc,serverTimestamp}=state.fb.fs;const r=state.room;if(r.turn!==pending.turn||r.phase!=='playing')throw Error('Il round è già terminato');await setDoc(doc(state.fb.db,'rooms',r.code,'submissions',r.turn+'_'+state.uid),{uid:state.uid,turn:r.turn,miniId:r.miniId,raw:pending.raw,detail:pending.detail,submittedAt:serverTimestamp()});state.pendingSubmission=null;updateStat('#send-status','Risultato registrato!');hostCheck()}catch(e){showToast('Invio risultato: '+e.message)}return}
 if(a==='resume-room')return resumeOnline();
 if(a==='start-match'||a==='next-phase')return hostAdvance();
 if(a==='add-bot')return addBot();
 if(a==='copy-room'){const invite=`LA SCALATA 👑 Entra in partita! Codice: ${state.room.code} | Link: ${location.href.split('?')[0]}`;try{await navigator.clipboard.writeText(invite);showToast('Invito copiato!')}catch(e){showToast('Codice stanza: '+state.room.code)}return}
});
document.querySelector('#brand-home').addEventListener('click',()=>{cleanupRoom();switchView('home')});
document.querySelector('#brand-home').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cleanupRoom();switchView('home')}});
render();
loadPortraits();

</script>
