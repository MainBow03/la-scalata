name: Pubblica La Scalata su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Controlla che il JavaScript sia valido
        run: |
          node -e "const fs=require('fs'),vm=require('vm');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\s\S]*?)<\/script>/);if(!m)throw Error('Script principale non trovato');new vm.Script(m[1]);console.log('JavaScript valido');"
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara sito statico
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
